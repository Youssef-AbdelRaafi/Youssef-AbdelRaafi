<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" aria-label="Youssef Deghidy - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d1117"/>
      <stop offset="55%"  stop-color="#111a29"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </linearGradient>

    <!-- reveal window for line 1 -->
    <clipPath id="clip1">
      <rect x="200" y="36" height="58" width="0">
        <animate attributeName="width"
                 values="0;400;400;0;0"
                 keyTimes="0;0.22;0.94;0.95;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- reveal window for line 2 -->
    <clipPath id="clip2">
      <rect x="265" y="98" height="40" width="0">
        <animate attributeName="width"
                 values="0;0;270;270;0;0"
                 keyTimes="0;0.28;0.50;0.94;0.95;1"
                 dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="1" y="1" width="798" height="188" rx="14" fill="url(#bg)" stroke="#1f2937" stroke-width="1.5"/>

  <g opacity="1">
    <animate attributeName="opacity"
             values="1;1;0;0;1"
             keyTimes="0;0.88;0.93;0.96;1"
             dur="9s" repeatCount="indefinite"/>

    <!-- line 1: name -->
    <g clip-path="url(#clip1)">
      <text x="202" y="80" textLength="396" lengthAdjust="spacing"
            font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="44" font-weight="700" fill="#58a6ff">Youssef Deghidy</text>
    </g>

    <!-- caret for line 1 -->
    <g>
      <animate attributeName="opacity"
               values="1;1;0;0"
               keyTimes="0;0.26;0.27;1"
               dur="9s" repeatCount="indefinite"/>
      <rect y="42" width="4" height="46" rx="2" fill="#1f6feb" x="198">
        <animate attributeName="x"
                 values="198;598;598;198;198"
                 keyTimes="0;0.22;0.94;0.95;1"
                 dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
                 dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- line 2: title -->
    <g clip-path="url(#clip2)">
      <text x="267" y="126" textLength="265" lengthAdjust="spacing"
            font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
            font-size="26" font-weight="500" fill="#c9d1d9" letter-spacing="0">Software Engineer</text>
    </g>

    <!-- caret for line 2 -->
    <g>
      <animate attributeName="opacity"
               values="0;0;1;1"
               keyTimes="0;0.28;0.29;1"
               dur="9s" repeatCount="indefinite"/>
      <rect y="102" width="3" height="30" rx="1.5" fill="#58a6ff" x="264">
        <animate attributeName="x"
                 values="264;264;534;534;264;264"
                 keyTimes="0;0.28;0.50;0.94;0.95;1"
                 dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity"
                 values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
                 dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- accent rule -->
    <rect x="250" y="152" width="300" height="2" rx="1" fill="url(#rule)">
      <animate attributeName="opacity"
               values="0;0;1;1" keyTimes="0;0.52;0.62;1"
               dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
